[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-proofreading"
version = "0.1.0"
description = "Automated proofreading workflow for multi-column exam preparation books"
authors = [{name = "Automation"}]
readme = "docs/exam_proofreading_workflow.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
]
full = [
    "opencv-python",
    "pillow",
    "pymupdf",
    "PyPDF2",
    "pytesseract",
    "scikit-learn",
]

[project.scripts]
exam-proofreader = "exam_proofreading.cli:main"
